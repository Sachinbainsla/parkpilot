services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: parkpilot
      POSTGRES_USER: parkpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - parking_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkpilot"]
      interval: 5s
      retries: 10
volumes:
  parking_data:
